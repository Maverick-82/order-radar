<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>거래처 주문 레이더</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#2a78d6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="주문레이더">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f4; --ink:#131820; --ink-2:#434b58; --muted:#737d8b; --line:#e1e5ea; --line-2:#cfd5dd;
  --accent:#2a78d6; --accent-ink:#1c5cab; --accent-soft:#e2edfa;
  --good:#1d7f47; --good-soft:#dff1e6; --warn:#a66300; --warn-soft:#fbeed6; --bad:#c23636; --bad-soft:#fbe3e3; --idle:#667085; --idle-soft:#eceef2;
  --bar:#2a78d6; --bar-muted:#b7d3f6; --shadow:0 8px 30px rgba(20,30,50,.14);
  --font:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0f1216; --surface:#171b21; --surface-2:#1f242c; --ink:#eef1f5; --ink-2:#c3cad4; --muted:#8e98a5; --line:#2a3039; --line-2:#3a424d;
  --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:#182a41;
  --good:#45b877; --good-soft:#15301f; --warn:#e2a23c; --warn-soft:#342711; --bad:#ee6b6b; --bad-soft:#3a1b1c; --idle:#9aa3b0; --idle-soft:#262b33;
  --bar:#3987e5; --bar-muted:#1c5cab; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#171b21; --surface-2:#1f242c; --ink:#eef1f5; --ink-2:#c3cad4; --muted:#8e98a5; --line:#2a3039; --line-2:#3a424d;
  --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:#182a41;
  --good:#45b877; --good-soft:#15301f; --warn:#e2a23c; --warn-soft:#342711; --bad:#ee6b6b; --bad-soft:#3a1b1c; --idle:#9aa3b0; --idle-soft:#262b33;
  --bar:#3987e5; --bar-muted:#1c5cab; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;margin:0;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1280px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:14px 16px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;max-width:1280px;margin:0 auto;justify-content:space-between}
.brand h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:12.5px}
.whoami{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
.whoami .role{font-size:11px;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:1px 8px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1280px;margin:10px auto 0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:none;font:inherit;color:var(--ink-2);padding:9px 12px 10px;border-bottom:2px solid transparent;cursor:pointer;font-weight:500;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.view{padding-top:18px;display:grid;gap:18px}
section.view > *{min-width:0}
h2{font-size:16px;margin:0;font-weight:600}
h3{font-size:14px;margin:0;font-weight:600}
.lede{color:var(--ink-2);margin:0;max-width:75ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:12px}
.panel-h .note{color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px}
.kpi .s{font-size:12px;color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.lnk{color:var(--accent-ink);cursor:pointer;text-decoration:none;border:0;background:none;font:inherit;padding:0;text-align:left}
.lnk:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 8px 1px 7px;border-radius:999px;white-space:nowrap;line-height:18px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-good{color:var(--good);background:var(--good-soft)}
.s-warn{color:var(--warn);background:var(--warn-soft)}
.s-bad{color:var(--bad);background:var(--bad-soft)}
.s-info{color:var(--accent-ink);background:var(--accent-soft)}
.s-idle{color:var(--idle);background:var(--idle-soft)}
.tag{display:inline-block;font-size:11px;color:var(--ink-2);background:var(--surface-2);border-radius:4px;padding:0 6px;white-space:nowrap;line-height:18px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search],.filters select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:7px 10px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;border:0;background:var(--surface);color:var(--ink-2);padding:6px 12px;cursor:pointer;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.btn{font:inherit;font-size:12.5px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:7px;padding:5px 10px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.subnav{display:flex;flex-wrap:wrap;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:18px}
.grid2 > *{min-width:0}
.hbars{display:grid;gap:7px}
.hbar{display:grid;grid-template-columns:minmax(80px,150px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hbar .t{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.hbar .t b{display:block;height:100%;background:var(--bar);border-radius:0 3px 3px 0}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbars-wrap{overflow-x:auto}
.vbars{display:flex;align-items:flex-end;gap:4px;height:160px;padding-top:10px}
.vbars .col{flex:1 1 0;min-width:34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.vbars .bar{width:70%;background:var(--bar);border-radius:3px 3px 0 0;min-height:1px}
.vbars .lbl{font-size:10.5px;color:var(--muted);margin-top:4px;white-space:nowrap}
.vbars .val{font-size:10px;color:var(--muted);margin-bottom:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.explain{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--ink-2)}
.explain b{color:var(--ink)}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12.5px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:3px 11px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
details.help summary{cursor:pointer;color:var(--accent-ink);font-size:13px}
details.help[open] summary{margin-bottom:8px}
dl.defs{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0;font-size:12.5px}
dl.defs dt{font-weight:600}
dl.defs dd{margin:0;color:var(--ink-2)}
.rowhd{white-space:nowrap;font-size:11.5px;font-weight:600;color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(880px,100%);background:var(--bg);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer-h{display:flex;align-items:flex-start;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer-h .ttl{flex:1;min-width:0}
.drawer-h h2{font-size:17px;word-break:keep-all}
.drawer-b{flex:1;overflow-y:auto;padding:16px 18px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:start;grid-auto-rows:max-content}
.drawer-b > *{min-width:0}
.x{font:inherit;font-size:20px;line-height:1;border:0;background:none;color:var(--ink-2);cursor:pointer;padding:4px 6px;border-radius:6px}
.x:hover{background:var(--surface-2)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:12.5px;color:var(--ink-2)}
.order{border-top:1px solid var(--line);padding:10px 0}
.order:first-child{border-top:0}
.order.click{cursor:pointer;margin-inline:-8px;padding-inline:8px;border-radius:8px}
.order.click:hover{background:var(--surface-2)}
.order-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.order-h .amt{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.order .ship{font-size:12px;color:var(--ink-2);white-space:pre-wrap;word-break:break-all;margin-top:3px}
/* order detail modal */
.omodal-scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:50}
.omodal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(480px,92vw);max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);z-index:51}
.omodal-h{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.omodal-h .ttl{flex:1;min-width:0}
.omodal-h h3{font-size:15px;word-break:keep-all}
.omodal-b{padding:14px 18px 20px;display:grid;gap:14px}
.info-row{font-size:13px;display:grid;grid-template-columns:56px 1fr;gap:8px}
.info-row .l{color:var(--muted)}
.info-row .v{word-break:break-all}
.contact-phones{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.contact-phones a{color:var(--accent-ink);text-decoration:none;font-weight:600;border:1px solid var(--accent-soft);background:var(--accent-soft);border-radius:999px;padding:2px 10px;font-size:12.5px}
.contact-phones a:hover{text-decoration:underline}
.omodal-total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;padding-top:8px;border-top:1px solid var(--line)}
.quicklog{display:grid;gap:8px;border:1px dashed var(--line-2);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.log-item{display:grid;gap:3px;padding:9px 0;border-bottom:1px solid var(--line)}
.log-item:last-child{border-bottom:0}
.log-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.log-h .who{font-size:12px;color:var(--muted)}
.log-note{font-size:13px;white-space:pre-wrap}
.log-next{font-size:12px;color:var(--accent-ink)}
.log-del{font-size:11.5px;color:var(--muted);border:0;background:none;cursor:pointer;margin-left:auto}
.log-del:hover{color:var(--bad)}
.log-outcome{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px}
.log-outcome.ok{color:var(--good);background:var(--good-soft)}
.log-outcome.pending{color:var(--warn);background:var(--warn-soft)}
.log-outcome.none{color:var(--muted);background:var(--surface-2)}
.log-form{display:grid;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.log-form .row{display:flex;flex-wrap:wrap;gap:8px}
.log-form select,.log-form input[type=date]{font:inherit;font-size:13px;border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;background:var(--surface)}
.log-form textarea{font:inherit;font-size:13px;border:1px solid var(--line-2);border-radius:6px;padding:8px;resize:vertical;min-height:56px;background:var(--surface);color:var(--ink)}
.log-form label.small{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
/* auth */
.authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
.authcard{width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:var(--shadow)}
.authcard h1{font-size:18px;margin:0 0 4px}
.authcard p.lede{margin-bottom:18px}
.authcard label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:4px;margin-top:12px}
.authcard input{width:100%;font:inherit;font-size:14px;border:1px solid var(--line-2);border-radius:7px;padding:9px 10px;background:var(--surface);color:var(--ink)}
.authcard .err{color:var(--bad);font-size:12.5px;margin-top:10px}
.authcard .ok{color:var(--good);font-size:12.5px;margin-top:10px}
.authcard .switch{margin-top:16px;font-size:12.5px;text-align:center;color:var(--ink-2)}
.hide{display:none !important}
.spin{color:var(--muted);font-size:13px;padding:20px}
@media (max-width:640px){
  .hide-sm{display:none}
  body{padding-inline:12px}
  .brand h1{font-size:17px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi{padding:12px}
  .kpi .v{font-size:17px}
  nav.tabs button{padding:8px 10px 9px;font-size:12.5px}
  .drawer{width:100%}
  .drawer-b{padding:14px 14px calc(32px + env(safe-area-inset-bottom,0px))}
  .panel{padding:13px}
  table{font-size:12.5px}
}
</style>
</head>
<body>

<div id="auth" class="authwrap">
  <div class="authcard">
    <h1>거래처 주문 레이더</h1>
    <p class="lede small">팀 계정으로 로그인하세요.</p>
    <div id="loginBox">
      <label>이메일</label>
      <input id="li-email" type="email" autocomplete="username">
      <label>비밀번호</label>
      <input id="li-pw" type="password" autocomplete="current-password">
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn primary" id="btn-login" style="flex:1">로그인</button>
      </div>
      <div class="switch">아직 계정이 없나요? <a href="#" id="go-signup" class="lnk">가입하기</a> · <a href="#" id="go-forgot" class="lnk">비밀번호를 잊으셨나요?</a></div>
      <div id="loginMsg"></div>
    </div>
    <div id="signupBox" class="hide">
      <label>이름</label>
      <input id="su-name" type="text" autocomplete="name">
      <label>이메일</label>
      <input id="su-email" type="email" autocomplete="username">
      <label>비밀번호 (6자 이상)</label>
      <input id="su-pw" type="password" autocomplete="new-password">
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn primary" id="btn-signup" style="flex:1">가입하기</button>
      </div>
      <div class="switch">이미 계정이 있나요? <a href="#" id="go-login" class="lnk">로그인</a></div>
      <div id="signupMsg"></div>
    </div>
    <div id="forgotBox" class="hide">
      <p class="lede small">가입할 때 쓴 이메일을 입력하면 비밀번호 재설정 링크를 보내드려요.</p>
      <label>이메일</label>
      <input id="fp-email" type="email" autocomplete="username">
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn primary" id="btn-forgot" style="flex:1">재설정 링크 보내기</button>
      </div>
      <div class="switch"><a href="#" id="go-login-2" class="lnk">로그인으로 돌아가기</a></div>
      <div id="forgotMsg"></div>
    </div>
    <div id="resetBox" class="hide">
      <p class="lede small">새 비밀번호를 설정하세요.</p>
      <label>새 비밀번호 (6자 이상)</label>
      <input id="rp-pw" type="password" autocomplete="new-password">
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn primary" id="btn-reset" style="flex:1">비밀번호 변경</button>
      </div>
      <div id="resetMsg"></div>
    </div>
  </div>
</div>

<div id="app" class="wrap hide">
<header class="top">
  <div class="brand">
    <div><h1>거래처 주문 레이더</h1> <span class="sub">이카운트 주문 데이터 · Supabase</span></div>
    <div class="whoami">
      <span id="who-name"></span><span class="role" id="who-role"></span>
      <button class="btn" id="btn-logout">로그아웃</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="summary" aria-selected="true">요약</button>
    <button data-tab="customers" aria-selected="false">거래처</button>
    <button data-tab="sales" aria-selected="false">영업</button>
    <button data-tab="products" aria-selected="false">제품가격</button>
  </nav>
</header>

<section class="view" id="view-summary"></section>
<section class="view hide" id="view-customers"></section>
<section class="view hide" id="view-sales"></section>
<section class="view hide" id="view-products"></section>
</div>

<div id="drawerHost"></div>
<div id="toast" class="toast" hidden></div>

<script>
const SUPABASE_URL = "https://hevlgbkkzrambtkqfbka.supabase.co";
const SUPABASE_KEY = "sb_publishable_SHekPJ0rm5wZHxQORLY8Wg_GA1Jk-It";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const won = n => (n==null? '-' : Math.round(n).toLocaleString('ko-KR')+'원');
const num = n => (n==null? '-' : Math.round(n).toLocaleString('ko-KR'));
const fmtDate = d => d ? d : '-';
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eok = n => ((Number(n)||0)/1e8).toFixed(2)+'억';
function daysAgoStr(n){ if(n==null) return '-'; if(n<=0) return '오늘'; return n+'일 전'; }
// 주문서의 담당자 필드는 "김성준 010-2914-2422", "백마리아 차장 02-399-1082 / 010-5282-8548",
// "복지후생담당관실 박준우 행정관 02-3480-1942/010-2387-5635" 처럼 이름(+직함/부서)과 전화번호가
// 한 줄에 자유롭게 섞여 있어서, 전화번호만 뽑아내 바로 누를 수 있는 링크로 만들고 나머지를 담당자 이름으로 씀.
function parseContact(raw){
  if(!raw || !String(raw).trim()) return null;
  const s = String(raw).trim();
  const phoneRe = /(01[016789][-.\s]?\d{3,4}[-.\s]?\d{4}|0[2-6][0-9]?[-.\s]?\d{3,4}[-.\s]?\d{4})/g;
  const phones = [...new Set((s.match(phoneRe)||[]).map(p=>p.trim()))];
  let name = s;
  phones.forEach(p=>{ name = name.split(p).join(' '); });
  name = name.replace(/[\/,·]/g,' ').replace(/\s+/g,' ').trim();
  return {name, phones, raw:s};
}
function toast(msg){
  const t = document.getElementById('toast'); if(!t) return;
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, 1800);
}
function copyTSV(rows, label){
  const txt = rows.map(r=>r.map(v=>String(v??'').replace(/[\t\n\r]+/g,' ')).join('\t')).join('\n');
  const done = () => toast(`${label} ${rows.length-1}행 복사됨 · 엑셀에 붙여넣기 하세요`);
  try{ navigator.clipboard.writeText(txt).then(done, fallback); }catch(e){ fallback(); }
  function fallback(){
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('복사가 막혀 있어요. 표를 드래그해서 복사하세요'); }
    ta.remove();
  }
}

function hbars(rows, max){
  max = max || Math.max(...rows.map(r=>r.v),1);
  return `<div class="hbars">${rows.map(r=>`<div class="hbar"><span class="nm" title="${esc(r.n)}">${esc(r.n)}</span><span class="t"><b style="width:${Math.max(0,r.v/max*100).toFixed(1)}%"></b></span><span class="num small">${r.s}</span></div>`).join('')}</div>`;
}
function monthBars(rows){
  const max = Math.max(...rows.map(r=>Number(r.amount)||0),1);
  return `<div class="vbars-wrap"><div class="vbars">${rows.map(r=>{
    const amt = Number(r.amount)||0;
    const h = Math.max(2, Math.round(amt/max*140));
    const lbl = r.month.slice(2,7).replace('-','.');
    return `<div class="col" title="${esc(lbl)} · ${won(r.amount)}"><div class="val">${amt?eok(amt):''}</div><div class="bar" style="height:${h}px"></div><div class="lbl">${esc(lbl)}</div></div>`;
  }).join('')}</div></div>`;
}
function monthTable(rows){
  if(!rows.length) return '';
  return `<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th class="rowhd">월</th>${rows.map(r=>`<th class="num">${esc(r.month.slice(2,7).replace('-','.'))}</th>`).join('')}</tr></thead><tbody>
    <tr><td class="rowhd">금액</td>${rows.map(r=>`<td class="num">${won(r.amount)}</td>`).join('')}</tr>
  </tbody></table></div>`;
}
// ---------------- generic year-range helpers (요약 차트 · 거래처 상세 차트 공용) ----------------
function monthYears(monthsArr){ return [...new Set((monthsArr||[]).map(m=>m.month.slice(0,4)))]; }
function monthYearBounds(monthsArr, y){
  let a=-1,b=-1;
  (monthsArr||[]).forEach((m,i)=>{ if(m.month.slice(0,4)===y){ if(a<0)a=i; b=i+1; } });
  return [a,b];
}
function monthRangeBounds(monthsArr, range){
  const n = (monthsArr||[]).length;
  const years = monthYears(monthsArr);
  if(range==='recent') return [Math.max(0, n-12), n];
  if(range==='all' || !years.includes(range)) return [0, n];
  return monthYearBounds(monthsArr, range);
}
function monthRangeChips(monthsArr, range, segId){
  const years = monthYears(monthsArr);
  if(years.length<=1) return '';
  const n = (monthsArr||[]).length;
  const opts = [['recent','최근 12개월'], ...years.map(y=>[y,y+'년']), ['all',`전체(${n}개월)`]];
  return `<div class="seg" id="${segId}">${opts.map(([k,label])=>`<button data-yr="${k}" aria-pressed="${range===k}">${label}</button>`).join('')}</div>`;
}

// ---------------- 품목 이름 정리 (특가/공동구매 등 태그 제거 후 동일 품목 합산) ----------------
// "특가(25년강남서초연간)-복사용지 A4/80g [2,500매]", "복사용지 A4/80g - 공동구매 [2,500매]",
// "복사용지 A4/80g(2,500매) [2,500매]" 처럼 실제로는 같은 품목인데 주문서에 붙는 태그·중복 표기 때문에
// 다른 이름으로 집계되던 것들을 하나로 합쳐서 보여주기 위한 정리 함수. 무게·규격·친환경 여부처럼
// 실제로 다른 품목을 가리키는 표기는 건드리지 않는다.
function normalizeItemName(raw){
  const s = String(raw||'').trim();
  const m = s.match(/^(.*?)(\s*\[[^\]]+\])?$/s);
  let base = (m && m[1] ? m[1] : s).trim();
  const bracket = (m && m[2]) ? m[2].trim() : '';
  base = base.replace(/^특가\([^)]*\)\s*-\s*/, '').replace(/^특가\s*-\s*/, '');
  base = base.replace(/\s*-\s*(공동구매|교육청)\s*$/, '');
  if(bracket){
    const bc = bracket.replace(/^\[|\]$/g, '').trim();
    const escRe = bc.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    base = base.replace(new RegExp('\\(' + escRe + '\\)\\s*$'), '').trim();
  }
  return bracket ? (base + ' ' + bracket) : base;
}
let itemTotalsCache = null;
async function ensureItemTotalsLoaded(){
  if(itemTotalsCache) return itemTotalsCache;
  const {data, error} = await sb.from('item_totals').select('*').order('amount', {ascending:false}).limit(1500);
  if(error){ itemTotalsCache = []; throw error; }
  itemTotalsCache = data || [];
  return itemTotalsCache;
}
function topMergedItems(rows, n){
  const byName = new Map();
  (rows||[]).forEach(r=>{
    const key = normalizeItemName(r.item_name);
    if(!byName.has(key)) byName.set(key, {item_name:key, amount:0, qty:0});
    const e = byName.get(key);
    e.amount += Number(r.amount)||0;
    e.qty += Number(r.qty)||0;
  });
  return [...byName.values()].sort((a,b)=>b.amount-a.amount).slice(0,n);
}

let forecastWindow = 30;
async function renderForecastView(){
  const el = document.getElementById('salesBody');
  el.innerHTML = '<div class="spin">불러오는 중...</div>';
  const end = new Date(); end.setDate(end.getDate()+forecastWindow);
  const start = new Date(); start.setDate(start.getDate()-21);
  const {data, error} = await sb.from('item_customer_stats').select('*')
    .neq('status','끊김의심')
    .gte('next_date', start.toISOString().slice(0,10))
    .lte('next_date', end.toISOString().slice(0,10))
    .order('next_date', {ascending:true})
    .limit(500);
  if(error){ el.innerHTML = `<div class="panel">불러오기 실패: ${esc(error.message)}</div>`; return; }
  const PST = {'정상':'s-idle','임박':'s-info','지연':'s-warn','끊김의심':'s-bad'};
  const rows = (data||[]).map(r=>({...r, cname:(custById.get(r.customer_id)||{}).name || ''}));
  el.innerHTML = `<div class="panel">
    <div class="panel-h"><h2>곧 재주문할 것으로 보이는 곳</h2>
      <div class="seg">${[14,30,60].map(w=>`<button data-w="${w}" aria-pressed="${w===forecastWindow}">${w}일 이내</button>`).join('')}</div></div>
    <p class="explain">품목별로 3번 이상 주기적으로 산 이력이 있으면 <b>평소 주문 간격</b>으로 다음 주문일을 예상했어요. 재고 준비나 먼저 연락하는 데 쓰세요. '지연'은 예상일이 조금 지난 곳이에요 — 오래 지난 곳은 영업 탭의 '품목 끊김'에서 볼 수 있어요.</p>
    ${critHelp('예상일·상태는 이렇게 계산했어요', `
      <dt>대상 품목</dt><dd>같은 거래처가 같은 품목을 3번 이상 주문한 경우만 — 1~2번만 산 품목은 주기를 알 수 없어 제외</dd>
      <dt>예상일</dt><dd>그 품목 주문 날짜들 사이 간격의 중앙값(평소 주기)을 마지막 주문일에 더해서 계산</dd>
      <dt>${statusPill('정상')}</dt><dd>예상일까지 15일 이상 남음</dd>
      <dt>${statusPill('임박')}</dt><dd>예상일이 14일 이내로 다가옴</dd>
      <dt>${statusPill('지연')}</dt><dd>경과일이 평소주기×1.5(또는 20일 중 큰 값)를 넘어 예상일이 이미 지남</dd>
      <dt>끊김의심 제외</dt><dd>경과일이 평소주기×3(또는 75일 중 큰 값)을 넘으면 '품목 끊김' 쪽으로 분류돼 이 목록엔 안 나와요</dd>
      <dt>표시 범위</dt><dd>오늘 기준 −21일 ~ 선택한 기간(14/30/60일) 이내로 예상되는 것만</dd>
    `)}
    <div class="small muted" style="margin:10px 0 6px">${num(rows.length)}건 예상</div>
    <div class="tbl-wrap"><table><thead><tr><th class="num">예상일</th><th>거래처</th><th>품목</th><th class="num">보통수량</th><th class="num">주기</th><th class="num hide-sm">마지막 주문</th><th>상태</th></tr></thead><tbody>
    ${rows.map(r=>`<tr class="click" data-id="${r.customer_id}"><td class="num">${r.next_date}</td><td>${esc(r.cname)}</td><td class="small">${esc(r.item_name)}</td><td class="num">${num(r.usual_qty)}</td><td class="num">${r.cycle_days}일</td><td class="num hide-sm">${r.last_date}</td><td><span class="pill ${PST[r.status]||'s-idle'}">${esc(r.status)}</span></td></tr>`).join('')}
    </tbody></table></div></div>`;
  el.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ forecastWindow=+b.dataset.w; renderForecastView(); });
  el.querySelectorAll('tr[data-id]').forEach(tr=> tr.onclick = ()=> openDrawer(Number(tr.dataset.id)) );
}

  // 그래서 입력창은 그대로 두고, 결과 영역만 갱신합니다.
  function filtered(){
    let list = PRODUCTS;
    if(prodCat!=='전체') list = list.filter(p=>p.c===prodCat);
    const q = prodQuery.trim().toLowerCase();
    if(q) list = list.filter(p=> p.n.toLowerCase().includes(q) || p.b.toLowerCase().includes(q));
    return list;
  }
  function draw(){
    const list = filtered();
    document.getElementById('prodResult').innerHTML = `
      <div class="small muted" style="margin-bottom:6px">${num(list.length)}개 상품</div>
      <div class="tbl-wrap"><table><thead><tr><th>품명</th><th>생산시설</th><th class="num">가격</th><th></th></tr></thead><tbody>

    const rows = [['생산시설','품명','가격']].concat(filtered().map(p=>[p.b,p.n,p.p]));
    copyTSV(rows, '제품가격');
  };

}
function copyProductLine(text){
  const done = ()=> toast('복사됐어요');
  const fallback = ()=>{
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('복사가 막혀 있어요. 텍스트를 드래그해서 복사하세요'); }
    ta.remove();
  };
  try{ navigator.clipboard.writeText(text).then(done, fallback); }catch(e){ fallback(); }
}

function timingGood(ctype){ const months = TIMING_GOOD_MONTHS[ctype]; return months ? months.includes(new Date().getMonth()+1) : false; }
// 우선순위 점수 = 상태(위험도) × 금액(로그스케일, 큰 곳으로 쏠리지 않게) × 경과 정도(주기 대비 얼마나 늦었는지) × 타이밍 보너스
function priorityScore(c){
  const riskW = {'이탈의심':3, '주의':2, '휴면':1.3, '일회성':0.8}[c.status] || 0;
  const amtScore = Math.log10((Number(c.total_amount)||0)+10000);
  const md_ = Number(c.typical_cycle_days)||0;
  const sn = Number(c.days_since_last_order)||0;
  const overdue = md_ ? Math.min(sn/md_, 6) : 1.5;
  return riskW * amtScore * (1 + overdue*0.15) * (timingGood(c.ctype) ? 1.2 : 1);
}

// success-window in days used for "영업 성공" matching
const OUTCOME_WINDOW_DAYS = 14;
function computeOutcome(activityDateStr, orderDates){
  // orderDates: array of 'YYYY-MM-DD' strings for that customer
  const a = new Date(activityDateStr+'T00:00:00');
  const end = new Date(a.getTime() + OUTCOME_WINDOW_DAYS*86400000);
  const today = new Date(new Date().toISOString().slice(0,10)+'T00:00:00');
  let hit = null;
  for(const ds of orderDates){
    const d = new Date(ds+'T00:00:00');
    if(d>=a && d<=end){ if(!hit || d<hit) hit = d; }
  }
  if(hit) return {state:'ok', date: hit.toISOString().slice(0,10)};
  if(today <= end) return {state:'pending'};
  return {state:'none'};
}

async function renderContactOutcome(){
  const body = document.getElementById('salesBody');
  body.innerHTML = '<div class="spin">불러오는 중...</div>';
  const {data: acts, error} = await sb.from('activities')
    .select('id,customer_id,kind,note,created_at,author_id,profiles(name),customers(name)')
    .in('kind', ['call','visit','sms'])
    .order('created_at', {ascending:false})
    .limit(500);
  if(error){ body.innerHTML = `<div class="panel">불러오기 실패: ${esc(error.message)}</div>`; return; }
  if(!acts || acts.length===0){
    body.innerHTML = `<div class="panel"><div class="panel-h"><h2>연락 성과</h2></div><p class="lede small muted">아직 기록된 통화·방문·문자가 없어요. 거래처 상세에서 기록을 남기면 여기서 성공률을 볼 수 있어요.</p></div>`;
    return;
  }
  const custIds = [...new Set(acts.map(a=>a.customer_id))];
  const {data: ords} = await sb.from('orders').select('customer_id,order_date').in('customer_id', custIds);
  const ordersByCust = new Map();
  (ords||[]).forEach(o=>{ if(!ordersByCust.has(o.customer_id)) ordersByCust.set(o.customer_id, []); ordersByCust.get(o.customer_id).push(o.order_date); });

  const rows = acts.map(a=>{
    const ds = a.created_at.slice(0,10);
    const outcome = computeOutcome(ds, ordersByCust.get(a.customer_id)||[]);
    return {...a, ds, outcome};
  });
  const total = rows.length;
  const ok = rows.filter(r=>r.outcome.state==='ok').length;
  const pending = rows.filter(r=>r.outcome.state==='pending').length;
  const decided = total - pending;
  const rate = decided>0 ? Math.round(ok/decided*100) : 0;

  const byAuthor = new Map();
  rows.forEach(r=>{
    const key = r.author_id;
    if(!byAuthor.has(key)) byAuthor.set(key, {name: (r.profiles&&r.profiles.name)||'(알수없음)', total:0, ok:0, decided:0});
    const e = byAuthor.get(key); e.total++;
    if(r.outcome.state!=='pending'){ e.decided++; if(r.outcome.state==='ok') e.ok++; }
  });
  const authorRows = [...byAuthor.values()].sort((a,b)=>b.total-a.total);

  body.innerHTML = `
    <div class="panel">
      <div class="panel-h"><h2>연락 성과</h2><span class="note">통화·방문·문자 후 ${OUTCOME_WINDOW_DAYS}일 이내 주문이 들어오면 "성공"으로 판단</span></div>
      <div class="kpis">
        <div class="kpi"><div class="l">총 접촉</div><div class="v">${num(total)}</div></div>
        <div class="kpi"><div class="l">성공</div><div class="v">${num(ok)}</div></div>
        <div class="kpi"><div class="l">성공률</div><div class="v">${decided>0? rate+'%' : '-'}</div><div class="s">판정 완료 ${num(decided)}건 기준</div></div>
        <div class="kpi"><div class="l">대기중</div><div class="v">${num(pending)}</div><div class="s">${OUTCOME_WINDOW_DAYS}일 아직 안 지남</div></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>담당자별</h3></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>담당자</th><th class="num">접촉수</th><th class="num">성공</th><th class="num">성공률</th></tr></thead>
        <tbody>${authorRows.map(a=>`<tr><td>${esc(a.name)}</td><td class="num">${num(a.total)}</td><td class="num">${num(a.ok)}</td><td class="num">${a.decided>0? Math.round(a.ok/a.decided*100)+'%':'-'}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>최근 기록</h3></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>날짜</th><th>거래처</th><th>구분</th><th>담당자</th><th>결과</th></tr></thead>
        <tbody>${rows.slice(0,100).map(r=>`<tr class="click" data-id="${r.customer_id}">
          <td>${r.ds}</td><td>${esc((r.customers&&r.customers.name)||'')}</td>
          <td>${LOG_TYPE[r.kind]||r.kind}</td>
          <td>${esc((r.profiles&&r.profiles.name)||'')}</td>
          <td>${outcomeBadge(r.outcome)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
  body.querySelectorAll('tr[data-id]').forEach(tr=> tr.onclick = ()=> openDrawer(Number(tr.dataset.id)) );
}

function outcomeBadge(o){
  if(o.state==='ok') return `<span class="log-outcome ok">주문 성공 (${o.date})</span>`;
  if(o.state==='pending') return `<span class="log-outcome pending">대기중</span>`;
  return `<span class="log-outcome none">성과 없음</span>`;
}

function salesDetailHTML(c, itemStats, recoRows){
  const stats = itemStats || [];
  const stopped = stats.filter(r=>r.status==='끊김의심').sort((a,b)=>(b.total_amount||0)-(a.total_amount||0));
  const delayed = stats.filter(r=>r.status==='지연').sort((a,b)=>(b.total_amount||0)-(a.total_amount||0));
  const upcoming = stats.filter(r=>r.status==='임박').sort((a,b)=> (a.next_date<b.next_date?-1:1));
  const have = new Set(stats.map(r=>r.item_name));
  const recos = (recoRows||[]).filter(r=>!have.has(r.item_name)).slice(0,3);

  const li = (arr, fmt) => arr.slice(0,5).map(r=>`<li>${fmt(r)}</li>`).join('');
  const sections = [];
  if(stopped.length){
    sections.push(`<div style="margin-top:10px"><b class="small">🔴 끊긴 것으로 보이는 품목 (${stopped.length}개)</b>
      <div class="small muted">평소 주기의 3배(또는 75일) 넘게 안 산 품목 — 다른 곳에서 사고 있을 가능성</div>
      <ul class="small" style="margin:6px 0 0 18px">${li(stopped, r=>`${esc(r.item_name)} — 평소 ${r.cycle_days}일 주기인데 ${r.since_days}일째 없음 (누적 ${won(r.total_amount)})`)}</ul></div>`);
  }
  if(delayed.length){
    sections.push(`<div style="margin-top:10px"><b class="small">🟡 늦어지고 있는 품목 (${delayed.length}개)</b>
      <ul class="small" style="margin:6px 0 0 18px">${li(delayed, r=>`${esc(r.item_name)} — 예상일 ${r.next_date}보다 늦어지는 중 (평소 ${r.cycle_days}일 주기)`)}</ul></div>`);
  }
  if(upcoming.length){
    sections.push(`<div style="margin-top:10px"><b class="small">🟢 곧 재주문할 것으로 보이는 품목 (${upcoming.length}개)</b>
      <ul class="small" style="margin:6px 0 0 18px">${li(upcoming, r=>`${esc(r.item_name)} — 예상일 ${r.next_date}${r.usual_qty?` (보통 ${num(r.usual_qty)}개)`:''}`)}</ul></div>`);
  }
  if(recos.length){
    sections.push(`<div style="margin-top:10px"><b class="small">💡 같은 유형 기관이 많이 사는 미구매 품목</b>
      <ul class="small" style="margin:6px 0 0 18px">${recos.map(r=>`<li>${esc(r.item_name)} — 동종(${esc(c.ctype||'')}) 구매율 ${r.penetration_pct}%</li>`).join('')}</ul></div>`);
  }
  if(!sections.length) return '';
  return `<div class="panel">
    <div class="panel-h"><h3>이 거래처의 품목별 근거</h3><span class="note">영업 탭 각 패널과 같은 기준</span></div>
    ${sections.join('')}
  </div>`;
}

// orders 테이블은 한 품목이 한 줄이라, 같은 날짜+주문번호(order_no)를 묶어야 실제 주문 1건이 됨.
// order_no가 없는 옛날 데이터는 그냥 각 줄을 독립된 주문으로 취급.
function groupOrders(orders){
  const map = new Map();
  (orders||[]).forEach(o=>{
    const key = (o.order_no!=null && o.order_no!=='') ? `${o.order_date}__${o.order_no}` : `row_${o.id}`;
    if(!map.has(key)) map.set(key, {order_date:o.order_date, order_no:o.order_no, address:o.address, contact:o.contact, delivery_note:o.delivery_note, summary:o.summary, status:o.status, items:[], total:0});
    const g = map.get(key);
    g.items.push(o);
    g.total += Number(o.supply_amount)||0;
  });
  return [...map.values()].sort((a,b)=>{
    if(a.order_date!==b.order_date) return a.order_date<b.order_date?1:-1;
    return (Number(b.order_no)||0)-(Number(a.order_no)||0);
  });
}

async function openDrawer(custId){
  const c = custById.get(custId);
  if(!c) return;
  const host = document.getElementById('drawerHost');
  host.innerHTML = `<div class="scrim"></div>
    <div class="drawer">
      <div class="drawer-h">
        <div class="ttl">
          <h2>${esc(c.name)}</h2>
          <div class="meta">${statusPill(c.status)} <span class="tag">${esc(c.ctype||'-')}</span> ${c.edu_office?`<span class="tag">${esc(c.edu_office)}</span>`:''}</div>
        </div>
        <button class="x" aria-label="닫기">✕</button>
      </div>
      <div class="drawer-b" id="drawerBody"><div class="spin">불러오는 중...</div></div>
    </div>`;
  const close = ()=>{ host.innerHTML=''; };
  host.querySelector('.scrim').onclick = close;
  host.querySelector('.x').onclick = close;

  const [{data: orders}, {data: acts}, {data: allOrders}, months, {data: itemStats}, {data: recoRows}] = await Promise.all([
    sb.from('orders').select('*').eq('customer_id', custId).order('order_date', {ascending:false}).order('order_no', {ascending:false}).limit(150),
    sb.from('activities').select('id,kind,note,next_contact_date,created_at,author_id,profiles(name)').eq('customer_id', custId).order('created_at', {ascending:false}),
    sb.from('orders').select('order_date,supply_amount').eq('customer_id', custId),
    ensureMonthsLoaded().catch(()=>[]),
    sb.from('item_customer_stats').select('*').eq('customer_id', custId).then(r=>r, ()=>({data:[]})),
    c.ctype ? sb.from('item_type_penetration').select('*').eq('ctype', c.ctype).order('penetration_pct', {ascending:false}).limit(30).then(r=>r, ()=>({data:[]})) : Promise.resolve({data:[]})
  ]);
  const orderDates = (orders||[]).map(o=>o.order_date);
  const byMonth = new Map();
  (allOrders||[]).forEach(o=>{ if(!o.order_date) return; const m = o.order_date.slice(0,7)+'-01'; byMonth.set(m, (byMonth.get(m)||0)+(Number(o.supply_amount)||0)); });
  const hasAnyOrders = byMonth.size > 0;
  const custMonthsAll = (months && months.length)
    ? months.map(m=>({month: m.month, amount: byMonth.get(m.month)||0}))
    : [...byMonth.entries()].sort((a,b)=> a[0]<b[0]?-1:1).map(([month,amount])=>({month,amount}));
  let custRange = 'recent';
  // 주문(orders) 테이블은 한 줄이 "한 주문의 품목 하나"라서, 같은 날짜·같은 주문번호(order_no)끼리
  // 묶어야 실제 "주문 1건"이 됨 — 최근 주문 목록은 이 묶음 단위로 보여주고, 클릭하면 그 주문에 속한
  // 품목 전체와 배송지·담당자 연락처를 한번에 보여줌.
  const orderGroups = groupOrders(orders).slice(0,25);

  // 주문 상세(품목 전체 + 담당자 연락처)를 팝업으로 보여주고, 그 자리에서 바로 통화·방문·문자
  // 기록을 남길 수 있게 함 — 저장하면 드로어 아래쪽 "통화·방문 기록" 목록도 바로 갱신됨.
  function openOrderDetail(g){
    const mount = document.createElement('div');
    document.body.appendChild(mount);
    const contact = parseContact(g.contact);
    const closeModal = ()=>{ mount.remove(); };
    mount.innerHTML = `<div class="omodal-scrim"></div>
      <div class="omodal">
        <div class="omodal-h">
          <div class="ttl">
            <h3>${esc(c.name)}</h3>
            <div class="meta">${esc(g.order_date||'')}${g.order_no!=null?` · 주문번호 ${esc(g.order_no)}`:''} ${g.status?`<span class="pill s-idle">${esc(g.status)}</span>`:''}</div>
          </div>
          <button class="x" aria-label="닫기">✕</button>
        </div>
        <div class="omodal-b">
          ${g.address ? `<div class="info-row"><div class="l">배송지</div><div class="v">${esc(g.address)}</div></div>` : ''}
          <div class="info-row"><div class="l">담당자</div><div class="v">
            ${contact ? `${esc(contact.name||'-')}${contact.phones.length ? `<div class="contact-phones">${contact.phones.map(p=>`<a href="tel:${p.replace(/[^0-9]/g,'')}">📞 ${esc(p)}</a>`).join('')}</div>` : ''}` : `<span class="small muted">등록된 연락처가 없어요</span>`}
          </div></div>
          ${g.delivery_note ? `<div class="info-row"><div class="l">비고</div><div class="v small muted">${esc(g.delivery_note)}</div></div>` : ''}
          <div class="tbl-wrap"><table><thead><tr><th>품목</th><th class="num">수량</th><th class="num">금액</th></tr></thead><tbody>
            ${g.items.map(it=>`<tr><td>${esc(it.item_name||'')}</td><td class="num">${num(it.quantity)}</td><td class="num">${won(it.supply_amount)}</td></tr>`).join('')}
          </tbody></table></div>
          <div class="omodal-total"><span>총 금액</span><span>${won(g.total)}</span></div>
          <div class="quicklog">
            <div class="small muted">지금 연락했다면 바로 기록을 남기세요</div>
            <div class="row">
              <select id="oq-kind">
                <option value="call">전화</option>
                <option value="visit">방문</option>
                <option value="sms">문자</option>
              </select>
            </div>
            <textarea id="oq-note" placeholder="통화·방문·문자 내용을 남겨주세요"></textarea>
            <div style="display:flex;justify-content:flex-end"><button class="btn primary" id="oq-submit">기록 남기기</button></div>
            <div id="oq-msg"></div>
          </div>
        </div>
      </div>`;
    mount.querySelector('.omodal-scrim').onclick = closeModal;
    mount.querySelector('.x').onclick = closeModal;
    mount.querySelector('#oq-submit').onclick = async ()=>{
      const kind = mount.querySelector('#oq-kind').value;
      const note = mount.querySelector('#oq-note').value.trim();
      const msg = mount.querySelector('#oq-msg');
      if(!note){ msg.innerHTML = '<div class="err small">내용을 입력해주세요.</div>'; return; }
      const {error} = await sb.from('activities').insert({customer_id: custId, kind, note});
      if(error){ msg.innerHTML = `<div class="err small">저장 실패: ${esc(error.message)}</div>`; return; }
      toast('기록을 남겼어요');
      closeModal();
      const {data: acts2} = await sb.from('activities').select('id,kind,note,next_contact_date,created_at,author_id,profiles(name)').eq('customer_id', custId).order('created_at', {ascending:false});
      renderLogSection(custId, acts2||[], orderDates);
    };
  }

  const body = document.getElementById('drawerBody');
  if(!body) return; // drawer already closed

  function drawBody(){
    const [ra,rb] = monthRangeBounds(custMonthsAll, custRange);
    const chartRows = custMonthsAll.slice(ra,rb);
    body.innerHTML = `
      <div class="kpis">
        <div class="kpi"><div class="l">누적매출</div><div class="v">${won(c.total_amount)}</div></div>
        <div class="kpi"><div class="l">주문수</div><div class="v">${num(c.order_count)}</div></div>
        <div class="kpi"><div class="l">최근주문</div><div class="v">${daysAgoStr(c.days_since_last_order)}</div><div class="s">${c.last_date||''}</div></div>
        <div class="kpi"><div class="l">평소주기</div><div class="v">${c.typical_cycle_days? Math.round(c.typical_cycle_days)+'일':'-'}</div></div>
      </div>
      ${['이탈의심','주의','휴면','일회성'].includes(c.status) ? salesTipHTML(c) : ''}
      ${salesDetailHTML(c, itemStats, recoRows)}
      <div class="panel">
        <div class="panel-h"><h3>월별 주문금액</h3><span class="note">${chartRows.length}개월</span></div>
        ${hasAnyOrders ? monthRangeChips(custMonthsAll, custRange, 'custChartSeg') : ''}
        ${hasAnyOrders ? monthBars(chartRows) : '<p class="small muted">주문 이력이 없습니다.</p>'}
      </div>
      <div class="panel">
        <div class="panel-h"><h3>최근 주문 (${orderGroups.length}건)</h3><span class="note">눌러서 품목·담당자 연락처 보기</span></div>
        ${orderGroups.map((g,i)=>`<div class="order click" data-og="${i}">
          <div class="order-h"><b>${esc(g.order_date||'')}</b> <span class="small muted">품목 ${g.items.length}개${g.summary?` · ${esc(g.summary)}`:''}</span> <span class="amt">${won(g.total)}</span></div>
          ${g.address?`<div class="ship">${esc(g.address)}</div>`:''}
        </div>`).join('') || '<p class="small muted">주문 이력이 없습니다.</p>'}
      </div>
      <div class="panel" id="logPanel"></div>`;
    body.querySelectorAll('[data-yr]').forEach(b=> b.onclick = ()=>{ custRange = b.dataset.yr; drawBody(); });
    body.querySelectorAll('[data-og]').forEach(el=> el.onclick = ()=> openOrderDetail(orderGroups[Number(el.dataset.og)]) );
    renderLogSection(custId, acts||[], orderDates);
  }
  drawBody();
}

function renderLogSection(custId, acts, orderDates){
  const panel = document.getElementById('logPanel');
  if(!panel) return;
  panel.innerHTML = `
    <div class="panel-h"><h3>통화·방문·문자 기록</h3><span class="note">${acts.length}건</span></div>
    <div id="logList">${acts.map(a=>logItemHTML(a, orderDates)).join('') || '<p class="small muted">아직 기록이 없습니다.</p>'}</div>
    <div class="log-form" style="margin-top:12px">
      <div class="row">
        <select id="log-kind">
          <option value="call">전화</option>
          <option value="visit">방문</option>
          <option value="sms">문자</option>
        </select>
        <label class="small">다음 연락 예정일 <input type="date" id="log-next"></label>
      </div>
      <textarea id="log-note" placeholder="통화·방문·문자 내용을 남겨주세요"></textarea>
      <div style="display:flex;justify-content:flex-end"><button class="btn primary" id="log-submit">기록 남기기</button></div>
      <div id="log-msg"></div>
    </div>`;
  panel.querySelectorAll('.log-del').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm('이 기록을 삭제할까요?')) return;
      const id = btn.dataset.id;
      const {error} = await sb.from('activities').delete().eq('id', id);
      if(error){ alert('삭제 실패: '+error.message); return; }
      const {data: acts2} = await sb.from('activities').select('id,kind,note,next_contact_date,created_at,author_id,profiles(name)').eq('customer_id', custId).order('created_at', {ascending:false});
      renderLogSection(custId, acts2||[], orderDates);
    };
  });
  document.getElementById('log-submit').onclick = async ()=>{
    const kind = document.getElementById('log-kind').value;
    const note = document.getElementById('log-note').value.trim();
    const next = document.getElementById('log-next').value || null;
    const msg = document.getElementById('log-msg');
    if(!note){ msg.innerHTML = '<div class="err small">내용을 입력해주세요.</div>'; return; }
    const {error} = await sb.from('activities').insert({customer_id: custId, kind, note, next_contact_date: next});
    if(error){ msg.innerHTML = `<div class="err small">저장 실패: ${esc(error.message)}</div>`; return; }
    const c = custById.get(custId);
    const {data: orders2} = await sb.from('orders').select('order_date').eq('customer_id', custId);
    const newOrderDates = (orders2||[]).map(o=>o.order_date);
    const {data: acts2} = await sb.from('activities').select('id,kind,note,next_contact_date,created_at,author_id,profiles(name)').eq('customer_id', custId).order('created_at', {ascending:false});
    renderLogSection(custId, acts2||[], newOrderDates);
  };
}

const LOG_TYPE = {call:'전화', visit:'방문', sms:'문자'};
function logItemHTML(a, orderDates){
  const ds = a.created_at.slice(0,10);
  const outcome = computeOutcome(ds, orderDates);
  const mine = ME && a.author_id===ME.id;
  const canDel = mine || (ME && ME.role==='admin');
  return `<div class="log-item">
    <div class="log-h">
      <span class="tag">${LOG_TYPE[a.kind]||a.kind}</span>
      <span class="who">${esc((a.profiles&&a.profiles.name)||'')} · ${ds}</span>
      ${outcomeBadge(outcome)}
      ${canDel? `<button class="log-del" data-id="${a.id}">삭제</button>` : ''}
    </div>
    <div class="log-note">${esc(a.note)}</div>
    ${a.next_contact_date? `<div class="log-next">다음 연락 예정: ${a.next_contact_date}</div>` : ''}
  </div>`;
}
</script>
